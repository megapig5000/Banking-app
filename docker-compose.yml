services:
  postgres:
    image: postgres:15-alpine
    container_name: simple_bank_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-simple_bank}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-simple_bank}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:15-alpine
    container_name: simple_bank_postgres_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-root}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-password}
      POSTGRES_DB: ${TEST_DB_NAME:-simple_bank_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-root} -d ${TEST_DB_NAME:-simple_bank_test}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: simple_bank_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: simple_bank_frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata: